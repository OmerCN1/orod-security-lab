<!doctype html>
<!--
  lang is load-bearing: the UI text is English, and CSS `text-transform: uppercase`
  applies casing rules for the document language. Under lang="tr" every uppercase
  label rendered "i" as the dotted "İ" - INVESTIGATES became İNVESTİGATES.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080b" />
    <meta name="description" content="OROD autonomous code security dashboard" />
    <title>OROD Security Team</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
