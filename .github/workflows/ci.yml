name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run --no-sync ruff check src tests evals containers ../scripts/verify_ollama.py
      - name: Type check
        run: uv run --no-sync mypy src evals
      - name: Tests
        # Hermetic: OSV, Ollama and GitHub are mocked; the Docker runtime test is opt-in.
        run: uv run --no-sync pytest -q
      - name: Deterministic evaluation
        # Fails when a case the recorded report met is no longer met, or regresses.
        run: >-
          uv run --no-sync python -m evals run
          --out "$RUNNER_TEMP/eval"
          --check-baseline ../docs/evals/latest.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: ${{ runner.temp }}/eval
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
      - name: Type check and build
        run: npm run build
